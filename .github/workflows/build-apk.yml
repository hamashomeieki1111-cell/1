name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent demo debug keystore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.android"
          base64 -d ci/hamasho-trial-debug.keystore.b64 > "$GITHUB_WORKSPACE/.android/debug.keystore"

      - name: Verify official Hamasho SVG logo source
        run: |
          test -s app/src/main/assets/hamasho_logo_gold.svg
          grep -q '<svg' app/src/main/assets/hamasho_logo_gold.svg
          grep -q '濱匠 Hamasho' app/src/main/assets/hamasho_logo_gold.svg

      - name: Restore Hamasho photo sprite
        run: |
          cat ci/sprite_v091_part1.txt \
              ci/sprite_v091_part2.txt \
              ci/sprite_v091_part3.txt \
              ci/sprite_v091_part4.txt \
              ci/sprite_v091_part5.txt \
              ci/sprite_v091_part6.txt \
            | base64 -d > /tmp/home_sprite_v09_small.jpg
          test "$(od -An -tx1 -N2 /tmp/home_sprite_v09_small.jpg | tr -d ' \n')" = "ffd8"
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = '/tmp/home_sprite_v09_small.jpg'
          drawable = 'app/src/main/res/drawable/home_sprite_v09.jpg'
          asset = 'app/src/main/assets/home_sprite_v09.jpg'
          Path('app/src/main/assets').mkdir(parents=True, exist_ok=True)
          with Image.open(src) as im:
              im.verify()
          with Image.open(src) as im:
              im = im.convert('RGB').resize((800, 940), Image.Resampling.LANCZOS)
              im.save(drawable, 'JPEG', quality=88, optimize=True)
              im.save(asset, 'JPEG', quality=88, optimize=True)
          for p in (drawable, asset):
              with Image.open(p) as im:
                  assert im.size == (800, 940)
                  im.verify()
          print('Hamasho photo sprite restored to drawable and WebView assets')
          PY

      - name: Build debug APK with persistent signing home
        run: ANDROID_USER_HOME="$GITHUB_WORKSPACE/.android" gradle :app:assembleDebug --stacktrace

      - name: Verify original-design assets inside APK
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/home_sprite_v09.jpg > /tmp/apk_home_sprite.jpg
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/hamasho_logo_gold.svg > /tmp/apk_logo.svg
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/index.html > /tmp/apk_index.html
          test "$(od -An -tx1 -N2 /tmp/apk_home_sprite.jpg | tr -d ' \n')" = "ffd8"
          test -s /tmp/apk_logo.svg
          grep -q '<svg' /tmp/apk_logo.svg
          grep -q '濱匠 Hamasho' /tmp/apk_logo.svg
          test -s /tmp/apk_index.html
          grep -q "季節のおすすめ" /tmp/apk_index.html
          grep -q "濱匠" /tmp/apk_index.html
          python3 - <<'PY'
          from PIL import Image
          with Image.open('/tmp/apk_home_sprite.jpg') as im:
              assert im.size == (800, 940)
              im.verify()
          print('APK original-design HTML, photos and official SVG logo verified')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamasho-bettei-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
