plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.hamasho.bettei'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.hamasho.bettei'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.4-customer-staff-split'
    }

    signingConfigs {
        debug {
            storeFile file("${rootDir}/ci/hamasho-trial-debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
