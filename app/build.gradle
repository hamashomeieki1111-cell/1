plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.hamasho.bettei'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.hamasho.bettei'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.9.1-real-photo-fix'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
