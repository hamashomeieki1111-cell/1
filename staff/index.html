<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>濱匠別邸 会員管理</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{--bg:#17130f;--panel:#28221c;--panel2:#30281f;--gold:#d6b060;--text:#f6f1e7;--muted:#bcaf9a;--danger:#873730}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:860px;margin:auto;padding:24px 18px 40px}.brand{text-align:center;color:var(--gold);font-size:30px;font-weight:700}.sub{text-align:center;color:var(--muted);font-size:13px;margin-top:4px}.card{background:var(--panel);border-radius:18px;padding:18px;margin-top:16px}.gold{color:var(--gold)}h2{font-size:20px;margin:0 0 12px}input{width:100%;font-size:22px;padding:14px;border-radius:12px;border:1px solid #5b4c3c;background:#1e1a16;color:var(--text)}button{width:100%;font-size:18px;font-weight:700;padding:14px;border:0;border-radius:12px;margin-top:10px;background:var(--gold);color:#211a12}button.secondary{background:#4c4034;color:var(--text)}button.danger{background:var(--danger);color:#fff}.hidden{display:none}.camera{width:100%;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;position:relative}video,canvas{width:100%;height:100%;object-fit:cover}.scanline{position:absolute;left:12%;right:12%;top:50%;border-top:2px solid var(--gold)}.member{font-size:26px;font-weight:700;color:var(--gold)}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stat{background:var(--panel2);border-radius:12px;padding:14px;text-align:center}.stat b{display:block;color:var(--gold);font-size:24px}.small{font-size:13px;color:var(--muted);line-height:1.6}.ok{padding:12px;border-radius:12px;background:#263629;color:#dff3df;margin-top:12px}.warn{padding:12px;border-radius:12px;background:#493525;color:#ffe3bd;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">濱匠別邸</div>
  <div class="sub">店舗スタッフ 会員管理・iPad試作版</div>

  <section id="login" class="card">
    <h2 class="gold">スタッフ認証</h2>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN">
    <button onclick="login()">管理画面を開く</button>
    <div class="small" style="margin-top:8px">試作PIN：1188</div>
  </section>

  <main id="app" class="hidden">
    <section class="card">
      <h2 class="gold">会員QRを読み取る</h2>
      <div class="camera"><video id="video" playsinline muted></video><canvas id="canvas" class="hidden"></canvas><div class="scanline"></div></div>
      <button id="cameraBtn" onclick="startCamera()">カメラを起動</button>
      <button class="secondary" onclick="loadDemo()">デモ会員を表示</button>
      <div id="scanMsg" class="small" style="margin-top:8px">Androidアプリの会員証QRをカメラに向けてください。</div>
    </section>

    <section id="memberCard" class="card hidden">
      <div class="small">読み取り会員</div>
      <div id="memberId" class="member">-</div>
      <div id="rank" class="small"></div>
      <div class="statgrid">
        <div class="stat"><b id="available">0 pt</b><span class="small">利用可能</span></div>
        <div class="stat"><b id="cumulative">0 pt</b><span class="small">累計</span></div>
      </div>
      <div id="couponState" class="small" style="margin-top:10px"></div>
    </section>

    <section id="ops" class="hidden">
      <div class="card">
        <h2 class="gold">ポイント付与</h2>
        <div class="small">100円（税込）＝1ポイント</div>
        <input id="amount" type="number" inputmode="numeric" placeholder="会計金額 例：12800">
        <button onclick="addPoints()">ポイントを付与</button>
      </div>

      <div class="card">
        <h2 class="gold">ポイント使用</h2>
        <div class="small">1pt＝1円、300ptから使用</div>
        <input id="usePts" type="number" inputmode="numeric" placeholder="使用ポイント">
        <button onclick="usePoints()">ポイントを使用</button>
      </div>

      <div class="card">
        <h2 class="gold">今月のクーポン</h2>
        <div id="couponText" class="small"></div>
        <button id="couponBtn" onclick="useCoupon()">クーポンを使用済みにする</button>
      </div>

      <div id="result"></div>
      <div class="card">
        <div class="small">※このv0.4は「iPadでQRを読めるか」の試験版です。ここで変更したポイントはまだAndroidアプリへ自動同期しません。次段階で共有データベースに接続します。</div>
        <button class="danger" onclick="resetDemo()">iPad側の試作データをリセット</button>
      </div>
    </section>
  </main>
</div>
<script>
const PIN='1188';
let currentId=null, stream=null, scanning=false;
const defaults={available:428,cumulative:8750,couponUsed:false};
function login(){if(document.getElementById('pin').value===PIN){loginEl().classList.add('hidden');document.getElementById('app').classList.remove('hidden')}else alert('PINが違います')}
function loginEl(){return document.getElementById('login')}
function key(id){return 'hamasho_member_'+id}
function loadMember(id){currentId=id;let d;try{d=JSON.parse(localStorage.getItem(key(id)))||{...defaults}}catch(e){d={...defaults}};render(id,d)}
function save(d){localStorage.setItem(key(currentId),JSON.stringify(d));render(currentId,d)}
function getData(){try{return JSON.parse(localStorage.getItem(key(currentId)))||{...defaults}}catch(e){return {...defaults}}}
function rank(c){if(c>=30000)return '別邸';if(c>=10000)return '匠';if(c>=3000)return '雅';return '粋'}
function render(id,d){document.getElementById('memberCard').classList.remove('hidden');document.getElementById('ops').classList.remove('hidden');document.getElementById('memberId').textContent=id;document.getElementById('rank').textContent=rank(d.cumulative)+' 会員';document.getElementById('available').textContent=d.available+' pt';document.getElementById('cumulative').textContent=d.cumulative+' pt';document.getElementById('couponState').textContent='今月クーポン：'+(d.couponUsed?'使用済み':'未使用');document.getElementById('couponText').textContent=couponText(rank(d.cumulative));let b=document.getElementById('couponBtn');b.disabled=d.couponUsed;b.textContent=d.couponUsed?'使用済みです':'クーポンを使用済みにする'}
function couponText(r){if(r==='雅')return 'ビール・焼酎・ハイボールから1杯';if(r==='匠')return '日本酒を含む対象ドリンク1杯';if(r==='別邸')return '対象ドリンク1杯＋季節の一品';return '通常会員クーポン'}
function loadDemo(){loadMember('HMB-000001')}
async function startCamera(){if(scanning)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});let v=document.getElementById('video');v.srcObject=stream;await v.play();scanning=true;document.getElementById('cameraBtn').textContent='読み取り中…';requestAnimationFrame(tick)}catch(e){document.getElementById('scanMsg').textContent='カメラを起動できません。Safariのカメラ許可を確認してください。'}}
function stopCamera(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('cameraBtn').textContent='カメラを起動'}
function tick(){if(!scanning)return;let v=document.getElementById('video');if(v.readyState===v.HAVE_ENOUGH_DATA){let c=document.getElementById('canvas'),ctx=c.getContext('2d');c.width=v.videoWidth;c.height=v.videoHeight;ctx.drawImage(v,0,0,c.width,c.height);let img=ctx.getImageData(0,0,c.width,c.height);let code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});if(code){let raw=code.data||'';if(raw.startsWith('HAMASHO_MEMBER:')){let id=raw.split(':')[1];stopCamera();document.getElementById('scanMsg').textContent='読み取り成功：'+id;loadMember(id);return}}}requestAnimationFrame(tick)}
function addPoints(){if(!currentId)return;let yen=parseInt(document.getElementById('amount').value||'0',10);if(yen<100)return show('100円以上を入力してください',false);let pts=Math.floor(yen/100),d=getData();d.available+=pts;d.cumulative+=pts;save(d);show(yen+'円 → '+pts+'pt付与しました',true);document.getElementById('amount').value=''}
function usePoints(){if(!currentId)return;let pts=parseInt(document.getElementById('usePts').value||'0',10),d=getData();if(pts<300)return show('ポイント使用は300ptからです',false);if(pts>d.available)return show('利用可能ポイントを超えています',false);d.available-=pts;save(d);show(pts+'pt使用しました',true);document.getElementById('usePts').value=''}
function useCoupon(){let d=getData();if(d.couponUsed)return;if(confirm('今月のクーポンを使用済みにしますか？')){d.couponUsed=true;save(d);show('クーポンを使用済みにしました',true)}}
function resetDemo(){if(currentId&&confirm('iPad側の試作データを初期状態へ戻しますか？')){localStorage.removeItem(key(currentId));loadMember(currentId);show('初期状態へ戻しました',true)}}
function show(msg,ok){document.getElementById('result').innerHTML='<div class="'+(ok?'ok':'warn')+'">'+msg+'</div>'}
</script>
</body>
</html>
